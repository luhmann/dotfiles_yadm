def nonoToken = System.getenv('ZALANDO_GRADLE_TOKEN')
def nonoBaseUrl = System.getenv('ZALANDO_GRADLE_BASE_URL')

def useNonoRoute = { RepositoryHandler repos ->
    repos.withType(MavenArtifactRepository).configureEach { repo ->
        if (nonoToken && nonoBaseUrl && repo.url?.host == 'maven.zalando.net') {
            repo.url = URI.create(nonoBaseUrl + repo.url.rawPath)
            repo.allowInsecureProtocol = true
            repo.credentials(PasswordCredentials) {
                username = 'fldietrich'
                password = nonoToken
            }
            repo.authentication { basic(BasicAuthentication) }
        }
    }
}

beforeSettings { settings ->
    useNonoRoute(settings.pluginManagement.repositories)
    useNonoRoute(settings.dependencyResolutionManagement.repositories)
}

allprojects {
    useNonoRoute(repositories)
    buildscript { useNonoRoute(repositories) }
}
