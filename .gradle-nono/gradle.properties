# nono pi-jvm: every sandbox session gets its own daemons (the per-session truststore path is part of the
# daemon JVM args), so a daemon can never be reused after its session ends. 30 min keeps the speedup for
# repeated runs within a session but stops orphans sooner than Gradle's 3h default.
org.gradle.daemon.idletimeout=1800000
